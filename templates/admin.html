{% extends "base.html" %}
{% block title %}Menu sync admin{% endblock %}

{% block body %}
<div class="space-y-8">
  <header class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-semibold text-slate-700">Menu sync admin</h1>
      <p class="text-sm text-slate-400 mt-1">Manage menu item display text and view sync history.</p>
    </div>
    <div class="flex items-center gap-2">
      <a href="/"
         class="px-3 py-1.5 text-xs font-medium rounded-md bg-slate-200 text-slate-700 hover:bg-slate-300">
        &larr; Dashboard
      </a>
      <form method="post" action="/admin/sync" hx-post="/admin/sync"
            hx-target="#admin-content" hx-swap="outerHTML">
        <button type="submit"
                class="px-3 py-1.5 text-xs font-medium rounded-md bg-slate-800 text-white hover:bg-slate-700">
          Sync now
        </button>
      </form>
    </div>
  </header>

  <div id="admin-content">
  {% include "_admin_content.html" %}
  </div>
</div>
{% endblock %}
