{% extends "base.html" %}
{% block title %}Menu sync admin{% endblock %}

{% block body %}
<div class="space-y-8">
  <header class="flex items-center justify-between">
    <h1 class="text-2xl font-semibold text-slate-700">Menu sync</h1>
    <form method="post" action="/admin/sync" hx-post="/admin/sync"
          hx-target="#admin-content" hx-swap="outerHTML">
      <button type="submit"
              class="px-3 py-1.5 text-xs font-medium rounded-md bg-slate-800 text-white hover:bg-slate-700">
        Sync now
      </button>
    </form>
  </header>

  <div id="admin-content">
  {% include "_admin_content.html" %}
  </div>
</div>
{% endblock %}
