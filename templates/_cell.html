{# One radio cell - select this entree for (kid, date). Swapped in by HTMX. #}
{% set is_make_home = item == MAKE_AT_HOME %}
<div id="{{ cell_id }}" class="text-center min-w-20"{% if is_oob %} hx-swap-oob="true"{% endif %}>
  <button
    type="button"
    hx-post="/select"
    hx-vals='{"kid_id": {{ kid.id }}, "menu_date": "{{ menu_date }}", "selection": {{ item|tojson }}}'
    hx-target="#{{ cell_id }}"
    hx-swap="outerHTML"
    class="inline-flex items-center justify-center w-7 h-7 rounded-full border-2 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-slate-500
           {% if is_sent %}
             border-slate-400 text-slate-400 bg-transparent cursor-default
           {% elif selected %}
             {% if is_make_home %}border-emerald-500 text-white bg-emerald-500{% else %}text-white{% endif %}
           {% else %}
             border-slate-200 text-transparent hover:border-slate-400
           {% endif %}"
    {% if selected and not is_make_home and not is_sent %}style="border-color: {{ kid.color }}; background-color: {{ kid.color }}"{% endif %}
    aria-label="{{ kid.name }} {{ 'will make at home' if is_make_home else ('will eat ' + item) }}{% if is_sent %} (sent to Skylight){% endif %}">
    {% if is_sent %}
      &#10003;&#10003;
    {% elif selected %}
      &#10003;
    {% else %}
      &middot;
    {% endif %}
  </button>
</div>
